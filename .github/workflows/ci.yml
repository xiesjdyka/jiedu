name: Windows source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-install:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the exact source environment
        shell: pwsh
        run: ./scripts/setup.ps1 -PythonExecutable python -CacheDirectory "$env:RUNNER_TEMP/jiedu-setup"
      - name: Isolated release checks
        shell: pwsh
        run: |
          $env:TEMP="$env:RUNNER_TEMP/jiedu-tests"
          $env:TMP=$env:TEMP
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
          ./.venv312/Scripts/python.exe -X utf8 -m unittest tests.test_source_export tests.test_desktop_update tests.test_client_access tests.test_client_pairing tests.test_cold_start_web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv312/Scripts/python.exe -X utf8 -m unittest tests.test_branded_connect tests.test_one_prompt_connect tests.test_one_prompt_loopback tests.test_local_chat_collectors tests.test_cursor_local_collector tests.test_four_local_collectors tests.test_connection_deletion tests.test_client_config tests.test_encoder_service tests.test_hermes_tool_bridge tests.test_knowledge_wiki tests.test_candidate_reorganization tests.test_reorganization_link tests.test_wiki_history_snapshots tests.test_candidate_writer_authorization
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv312/Scripts/python.exe -X utf8 -m unittest tests.test_client_status tests.test_butler_output_controls tests.test_claude_source_recovery tests.test_butler_default_budget tests.test_butler_generation tests.test_butler_product_repair tests.test_butler_provider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_client_status_frontend.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv312/Scripts/python.exe -B -X utf8 -m unittest tests.test_service_creation tests.test_update_process_handoff tests.test_launcher_preflight tests.test_launcher_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv312/Scripts/python.exe scripts/export_source.py --output "$env:RUNNER_TEMP/jiedu-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv312/Scripts/python.exe -X utf8 -m unittest tests.test_release_version tests.test_update_workflow tests.test_update_quiesce tests.test_installer_destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  desktop-compile:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify program metadata and compile the retained native shell
        shell: pwsh
        working-directory: desktop
        run: |
          $metadataJson = & python -B -X utf8 release_version.py check --scope program --source ..
          if ($LASTEXITCODE -ne 0) { throw 'Program release metadata check failed' }
          $metadata = $metadataJson | ConvertFrom-Json
          $versionPath = (Resolve-Path -LiteralPath '../VERSION').Path
          $originalVersion = [System.IO.File]::ReadAllBytes($versionPath)
          Write-Host "Compile native shell $($metadata.native_build_version) retained by program $($metadata.version)"
          try {
            [System.IO.File]::WriteAllText($versionPath, "$($metadata.native_build_version)`n", [System.Text.UTF8Encoding]::new($false))
            cargo build --release --locked
            if ($LASTEXITCODE -ne 0) { throw "Native compilation failed with exit code $LASTEXITCODE" }
          } finally {
            [System.IO.File]::WriteAllBytes($versionPath, $originalVersion)
          }

